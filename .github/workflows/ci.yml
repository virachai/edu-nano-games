name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm exec eslint .
      - name: Type check
        run: pnpm exec tsc -b
      - name: Tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check games
        run: pnpm exec tsc -b
      - name: Prepare deploy artifact
        run: |
          mkdir -p _site
          cp -r index.html games shared _site || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # TEMPORARY: skipped until GitHub Pages is enabled for this repo with
    # Source = "GitHub Actions" (settings/pages). Until then the deploy step
    # 404s ("Failed to create deployment"). Re-enable by restoring the
    # original condition below:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    steps:
      - uses: actions/deploy-pages@v4
